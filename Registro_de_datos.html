<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Título de la página</title>
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <form action="#" method="post">
        <h1>Registro de Datos</h1>
         <fieldset style="width: 300px;">
    
        <label for="Nombre">Nombre:</label>
        <input type="text" name="Nombre" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" id="Nombre"  required><br><br>
        
        <label for="apellido">Apellido:</label>
        <input type="text" name="Apellido" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" id="apellido" required><br><br>
        
        <label>Edad:</label>
        <input type="number" name="Edad" min="5" max="100" required><br><br>
        
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" name="Fecha" min="1910-01-01" max="2025-12-31" id="fecha" required><br><br>
        
        <label for="ci">Cédula de Identidad:</label>
        <input type="text" name="Cédula" pattern="^[VE]-\d{5,9}$" placeholder="ej: V-21576892" id="ci" required><br><br>
        
        <label for="telf">Teléfono:</label>
        <input type="text" name="Teléfono" id="telf" pattern="^(0412|0414|0424|0416|0426)-\d{7}$" placeholder="ej: 0412-5789739" required><br><br>
        
        <label for="correo">Correo Electrónico:</label>
        <input type="email" name="correo" id="correo" placeholder="ej: correo@gmail.com"required><br><br>
        
        <label for="clave">Introduzca una contraseña:</label>
        <input type="password" name="contraseña" pattern="^(?=.*[A-Z])(?=.*\d).{8,}$" id="clave" required><br><br>
        
        <label>Género:</label><br>
<input type="radio" name="genero" value="hombre" id="hombre">
<label for="hombre">Hombre</label>

<input type="radio" name="genero" value="mujer" id="mujer">
<label for="mujer">Mujer</label>
<br><br>

        <label>Color favorito:</label>
        <input type="color" name="Color_favorito"><br><br>
         
       <label for="estado">Estado donde reside:</label>
<select id="estado" name="estado">
    <option value="ama">Amazonas</option>
<option value="ans">Anzoátegui</option>
<option value="apu">Apure</option>
<option value="ara">Aragua</option>
<option value="bar">Barinas</option>
<option value="bol">Bolívar</option>
<option value="crb">Carabobo</option>
<option value="coj">Cojedes</option>
<option value="dae">Delta Amacuro</option>
<option value="fal">Falcón</option>
<option value="gua">Guárico</option>
<option value="lar">Lara</option>
<option value="mer">Mérida</option>
<option value="mir">Miranda</option>
<option value="mon">Monagas</option>
<option value="nes">Nueva Esparta</option>
<option value="por">Portuguesa</option>
<option value="suc">Sucre</option>
<option value="tac">Táchira</option>
<option value="tru">Trujillo</option>
<option value="var">La Guaira</option>
<option value="yar">Yaracuy</option>
<option value="zul">Zulia</option>
</select><br><br>

        <button 
type="submit">Enviar</button>

<button 
type="reset">borrar</button>

        </fieldset>
    </form>
</body>
</html>
